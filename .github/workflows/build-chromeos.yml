name: Build - ChromeOS Native Bundle

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ci_version:
        description: 'CI Version Tag'
        required: true
        default: 'v1.0.0'
        type: string

  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string

jobs:
  build:
    env:
      CI_VERSION: ${{ inputs.ci_version }}

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup environment
        shell: bash
        run: |
          set -e

          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -

          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.4.313-jammy.list \
            https://packages.lunarg.com/vulkan/1.4.313/lunarg-vulkan-1.4.313-jammy.list

          sudo apt-get update

          sudo apt-get install -y \
            pkg-config \
            python3-pip \
            python3-venv \
            nasm \
            libgbm-dev \
            libdrm-dev \
            libfreetype-dev \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libglu1-mesa-dev \
            libibus-1.0-dev \
            libpulse-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxt-dev \
            libxv-dev \
            libxxf86vm-dev \
            libxcb-dri3-dev \
            libx11-xcb-dev \
            libxfixes-dev \
            libxtst-dev \
            wayland-protocols \
            libwayland-dev \
            libwayland-bin \
            libopus-dev \
            libvdpau-dev \
            libgl-dev \
            libpipewire-0.3-dev \
            liburing-dev \
            vulkan-sdk \
            cmake \
            qt6-base-dev \
            qt6-declarative-dev \
            libqt6svg6-dev \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window \
            qml6-module-qtquick

          # Install Meson in an isolated environment.
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/meson-venv/bin/python" -m pip install meson

          # Ensure subsequent steps can find our Meson.
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"

          # Explicit pkg-config search paths.
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"

          echo "PKG_CONFIG_LIBDIR=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"

          # Dependency root.
          mkdir -p dep_root/{bin,include,lib}

          echo "DEP_ROOT=$PWD/dep_root" >> "$GITHUB_ENV"
          echo "$PWD/dep_root/bin" >> "$GITHUB_PATH"

      - name: Checkout SDL3
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/SDL
          ref: ddba673cddfa79ce798eca5ba402e0f1a2a2a243
          path: deps/SDL

      - name: Build SDL3
        working-directory: deps/SDL
        shell: bash
        run: |
          set -e

          cmake \
            -DSDL_KMSDRM=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_INSTALL_DOCS=OFF \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -S . \
            -B build

          cmake --build build -j"$(nproc)"
          sudo cmake --install build

      - name: Checkout sdl2-compat
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/sdl2-compat
          ref: release-2.32.70
          path: deps/sdl2-compat

      - name: Build sdl2-compat
        working-directory: deps/sdl2-compat
        shell: bash
        run: |
          set -e

          cmake \
            -DSDL2COMPAT_TESTS=OFF \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -S . \
            -B build

          cmake --build build -j"$(nproc)"
          sudo cmake --install build

      - name: Checkout SDL_ttf
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/SDL_ttf
          ref: a883e490e30fb44a5336ea3dcb990c6982c5216f
          path: deps/SDL_ttf
          submodules: recursive

      - name: Build SDL_ttf
        working-directory: deps/SDL_ttf
        shell: bash
        run: |
          set -e

          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          sudo make install

      - name: Checkout libva
        uses: actions/checkout@v5
        with:
          repository: intel/libva
          ref: 2.24.1
          path: deps/libva

      - name: Build libva
        working-directory: deps/libva
        shell: bash
        run: |
          set -e

          ./autogen.sh

          ./configure \
            --enable-x11=no \
            --enable-drm=yes \
            --enable-wayland=yes

          make -j"$(nproc)"
          sudo make install

      - name: Checkout libplacebo
        uses: actions/checkout@v5
        with:
          repository: haasn/libplacebo
          ref: 41ac2980e1a898f41d7c2e07999f9862ee89d99f
          path: deps/libplacebo
          submodules: recursive

      - name: Build libplacebo
        working-directory: deps/libplacebo
        shell: bash
        run: |
          set -e

          MESON="$RUNNER_TEMP/meson-venv/bin/meson"

          git apply ../../app/deploy/linux/appimage/*.patch

          "$MESON" setup build \
            -Dvulkan=enabled \
            -Dopengl=disabled \
            -Ddemos=false

          ninja -C build

          "$MESON" install -C build

      - name: Build dav1d
        working-directory: deps
        shell: bash
        env:
          DAV1D_VER: 1.5.4
        run: |
          set -e

          git clone \
            --branch "$DAV1D_VER" \
            --depth 1 \
            https://code.videolan.org/videolan/dav1d.git

          pushd dav1d

          MESON="$RUNNER_TEMP/meson-venv/bin/meson"

          "$MESON" setup build \
            -Ddefault_library=static \
            -Dbuildtype=release \
            -Denable_tools=false \
            -Denable_tests=false

          ninja -C build
          "$MESON" install -C build

          popd

      - name: Checkout FFmpeg
        uses: actions/checkout@v5
        with:
          repository: FFmpeg/FFmpeg
          ref: n9.0
          path: deps/FFmpeg

      - name: Build FFmpeg
        working-directory: deps/FFmpeg
        shell: bash
        run: |
          set -e

          ./configure \
            --enable-pic \
            --enable-lto \
            --disable-static \
            --enable-shared \
            --disable-all \
            --disable-autodetect \
            --enable-avcodec \
            --enable-avformat \
            --enable-swscale \
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-decoder=av1 \
            --enable-vaapi \
            --enable-hwaccel=h264_vaapi \
            --enable-hwaccel=hevc_vaapi \
            --enable-hwaccel=av1_vaapi \
            --enable-vdpau \
            --enable-hwaccel=h264_vdpau \
            --enable-hwaccel=hevc_vdpau \
            --enable-hwaccel=av1_vdpau \
            --enable-libdrm \
            --enable-vulkan \
            --enable-hwaccel=h264_vulkan \
            --enable-hwaccel=hevc_vulkan \
            --enable-hwaccel=av1_vulkan \
            --enable-libdav1d \
            --enable-decoder=libdav1d

          make -j"$(nproc)"
          sudo make install

      - name: Build and Package ChromeOS Native Bundle
        shell: bash
        run: |
          set -e

          sudo ldconfig

          # 1. Build Moonlight binary
          qmake6 Moonlight.pro
          make -j"$(nproc)"

          # 2. Structure bundle directory
          BUNDLE_DIR="build/moonlight-chromeos"

          mkdir -p \
            "$BUNDLE_DIR/bin" \
            "$BUNDLE_DIR/lib" \
            "$BUNDLE_DIR/qt6/plugins/platforms"

          # Copy main binary
          cp app/moonlight "$BUNDLE_DIR/bin/"

          # Copy built shared dependencies
          cp /usr/local/lib/libSDL3*.so* "$BUNDLE_DIR/lib/"
          cp /usr/local/lib/libav*.so* "$BUNDLE_DIR/lib/"
          cp /usr/local/lib/libplacebo*.so* "$BUNDLE_DIR/lib/"
          cp /usr/local/lib/libva*.so* "$BUNDLE_DIR/lib/"

          # Copy Qt Wayland platform plugin
          cp \
            /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/libqwayland-generic.so \
            "$BUNDLE_DIR/qt6/plugins/platforms/"

          # Copy Qt Wayland plugin dependencies
          cp -r \
            /usr/lib/x86_64-linux-gnu/qt6/plugins/wayland-* \
            "$BUNDLE_DIR/qt6/plugins/"

          # 3. Create launcher script
          cat << 'EOF' > "$BUNDLE_DIR/start-moonlight.sh"
          #!/bin/sh

          BASE="$(cd "$(dirname "$0")" && pwd)"

          export XDG_RUNTIME_DIR="/run/chrome"
          export WAYLAND_DISPLAY="wayland-0"
          export QT_QPA_PLATFORM="wayland"
          export QT_PLUGIN_PATH="$BASE/qt6/plugins"
          export LD_LIBRARY_PATH="$BASE/lib:$LD_LIBRARY_PATH"

          exec "$BASE/bin/moonlight" "$@"
          EOF

          chmod +x "$BUNDLE_DIR/start-moonlight.sh"

          # 4. Package bundle
          tar -czf \
            build/Moonlight-ChromeOS-Native.tar.gz \
            -C build \
            moonlight-chromeos

      - name: Upload Binaries
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-ChromeOS-Native-${{ env.CI_VERSION }}
          path: build/Moonlight-ChromeOS-Native.tar.gz
